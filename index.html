<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地名語音調查系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>

    <h1>地名語音調查系統</h1>

    <div id="login-section" class="card">
        <input type="email" id="email" placeholder="Email">
        <button class="btn-primary" onclick="login()" id="login-btn">進入我的任務</button>
        <button class="btn-secondary" onclick="toggleAdminLogin()" id="admin-toggle-btn">管理者登入</button>
        <div id="admin-login-fields" class="hidden">
            <input type="password" id="password" placeholder="管理者密碼">
            <button class="btn-primary" onclick="loginAdmin()" id="admin-login-btn">進入管理模式</button>
        </div>
        <div id="login-status" style="text-align: center; margin-top: 10px; color: red;"></div>
    </div>

    <div id="app-section" class="hidden">
        <div class="tab-container">
            <button class="tab-btn active" id="tab-assigned" onclick="switchTab('assigned')">📝 任務清單</button>
            <button class="tab-btn" id="tab-other" onclick="switchTab('other')">🌍 其他地名</button>
            <button class="tab-btn hidden" id="tab-review" onclick="switchTab('review')">審查清單</button>
        </div>

        <div class="filter-section">
            <input type="text" id="search-box" placeholder="🔍 搜尋地名關鍵字..." oninput="applyFilters()">
            <div class="filter-row">
                <select id="county-filter" onchange="updateTowns(); applyFilters()">
                    <option value="">所有縣市</option>
                </select>
                <select id="town-filter" onchange="applyFilters()">
                    <option value="">所有鄉鎮</option>
                </select>
            </div>
            
            <div class="type-chips" id="type-container"></div>

            <div class="hak-area-chips" id="hak-area-container">
                <div class="hak-area-chip selected" onclick="selectHakArea('all', this)">全部分區</div>
                <div class="hak-area-chip" onclick="selectHakArea('hak', this)">客語區</div>
                <div class="hak-area-chip" onclick="selectHakArea('non-hak', this)">非客語區</div>
            </div>
            
            <div class="status-chips" id="status-container">
                <div class="status-chip selected" onclick="selectStatus('all', this)">全部狀態</div>
                <div class="status-chip" onclick="selectStatus('未錄音', this)">未錄音</div>
                <div class="status-chip" onclick="selectStatus('台語完成', this)">台語完成</div>
                <div class="status-chip" onclick="selectStatus('客語完成', this)">客語完成</div>
                <div class="status-chip" onclick="selectStatus('全部完成', this)">全部完成</div>
            </div>
        </div>

        <div class="place-list" id="place-list-container"></div>

        <div class="card" id="recording-section">
            <h3 id="selected-place-title" style="margin-top:0; color:var(--secondary);">未選擇地名</h3>
            
            <div class="language-tabs" role="radiogroup" aria-label="錄音語言">
                <label class="language-tab active" data-lang="台語">
                    <input type="radio" name="lang" value="台語" checked onchange="switchAnnotationLanguage('台語')">
                    台語
                </label>
                <label class="language-tab" data-lang="客語">
                    <input type="radio" name="lang" value="客語" onchange="switchAnnotationLanguage('客語')">
                    客語
                </label>
            </div>
            
            <div class="annotation-panel">
                <section class="annotation-group active" data-annotation-lang="台語">
                    <h4>台語填寫區 <span>選填</span></h4>
                    <input type="text" id="taihan-input" placeholder="地名台語漢字">
                    <input type="text" id="tl1-input" placeholder="台語羅馬字(當地主音讀)">
                    <textarea id="tainote-input" rows="4" placeholder="若有希望補充的資訊、發音，或覺得有疑問，請寫在這裡。"></textarea>
                </section>

                <section class="annotation-group" data-annotation-lang="客語">
                    <h4>客語填寫區 <span>選填</span></h4>
                    <input type="text" id="honzii-input" placeholder="地名客語漢字">
                    <input type="text" id="hp1-input" placeholder="客語羅馬字(當地主音讀)">
                    <textarea id="haknote-input" rows="4" placeholder="若有希望補充的資訊、說明腔調、發音，或覺得有疑問，請寫在這裡。"></textarea>
                </section>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="btn-record" id="start-btn" onclick="startRecording()" style="flex: 1; margin: 0;">🎤 現場錄音</button>
                <input type="file" id="audio-file-input" accept="audio/*" style="display:none;" onchange="handleFileUpload(event)">
                <button class="btn-file" id="file-btn" onclick="document.getElementById('audio-file-input').click()" style="flex: 1; margin: 0;">📂 選擇本機音檔</button>
            </div>

            <button class="btn-stop" id="stop-btn" onclick="stopRecording()">⏹️ 停止錄音</button>
            <audio id="audio-playback" controls style="width:100%; margin-bottom:10px; display:none;"></audio>
            <button class="btn-upload" id="upload-btn" onclick="uploadAudio()">⬆️ 上傳並準備下一筆</button>
            
            <div id="status" style="text-align:center; font-weight:bold;"></div>

            <div class="history-section" id="history-section">
                <h4 style="margin-top:0;">此地名已上傳的紀錄：</h4>
                <div id="history-list"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
